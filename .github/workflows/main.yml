name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find_dir
        run: |
          # البحث عن مكان ملف settings.gradle تلقائياً (سواء في الجذر أو داخل مجلد فرعي)
          SETTING_FILE=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
          if [ -z "$SETTING_FILE" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTING_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Project Files
        run: |
          test -f "${{ steps.find_dir.outputs.project_dir }}/settings.gradle"
          test -f "${{ steps.find_dir.outputs.project_dir }}/app/build.gradle"
          test -f "${{ steps.find_dir.outputs.project_dir }}/app/src/main/AndroidManifest.xml"

      - name: Build APK
        run: |
          cd "${{ steps.find_dir.outputs.project_dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qiyas-APK
          path: "${{ steps.find_dir.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
