name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          echo "Looking for zip files..."
          # البحث عن أي ملف zip مرفوع وفك ضغطه
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE, extracting..."
            unzip -q "$ZIP_FILE" -d extracted_project
            # الانتقال للمجلد المستخرج أو البحث عن مكان settings.gradle داخله
            cd extracted_project
          fi
          
          # التحقق من مكان وجود ملف settings.gradle بعد الفك
          SETTING_FILE=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
          if [ -z "$SETTING_FILE" ]; then
            echo "Error: settings.gradle not found even after extraction!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTING_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project path resolved to: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          # الدخول لمسار المشروع وفك الضغط للوصول لـ Gradle وبناء التطبيق
          cd extracted_project/${{ env.project_dir }}
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qiyas-APK
          path: "extracted_project/**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
